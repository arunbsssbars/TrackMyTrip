name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_android.yml'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create fallback .env file
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "Using secret ENV_FILE configured in repository secrets."
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            echo "NOTICE: ENV_FILE secret not found; using fallback template from .env.example."
            cp .env.example .env
          fi
          echo "Environment configuration ready ($(wc -l < .env) lines)."

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Validate Release APK Size Budget (< 150MB Universal)
        run: |
          chmod +x scripts/measure_bundle_size.sh
          ./scripts/measure_bundle_size.sh build/app/outputs/flutter-apk/app-release.apk 150.0

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyTrip-Android-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Distribute to Firebase App Distribution (Beta Testers)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        continue-on-error: true
        with:
          appId: ${{ secrets.FIREBASE_APP_ID || '1:731719697818:android:9eebe113d9181780bce623' }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Automated TrackMyTrip release from commit ${{ github.sha }}: ${{ github.event.head_commit.message }}"

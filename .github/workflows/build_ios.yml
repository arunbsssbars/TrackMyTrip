name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify CocoaPods Environment
        run: pod --version

      - name: Create fallback .env file for asset bundling
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "Using secret ENV_FILE configured in repository secrets."
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            echo "NOTICE: ENV_FILE secret not found; using fallback template from .env.example."
            cp .env.example .env
          fi
          echo "Environment configuration ready ($(wc -l < .env) lines)."

      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Build iOS App with Unsigned Signing Allowed
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGN_REQUIRED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

      - name: Bundle Payload into Unsigned IPA
        run: |
          mkdir -p build/Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app build/Payload/
          elif [ -d "build/ios_derived/Build/Products/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/Payload/
          else
            echo "Searching for built Runner.app bundle..."
            FOUND_APP=$(find build -name "Runner.app" -type d | head -n 1)
            if [ -n "$FOUND_APP" ]; then
              cp -r "$FOUND_APP" build/Payload/
            else
              echo "Error: Runner.app not found in build directory!"
              exit 1
            fi
          fi
          cd build
          zip -r -q TrackMyTrip-release-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyTrip-ios-ipa
          path: build/TrackMyTrip-release-unsigned.ipa
          retention-days: 7

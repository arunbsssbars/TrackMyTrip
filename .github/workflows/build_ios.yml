name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify CocoaPods Environment
        run: |
          pod --version

      - name: Create fallback .env file for asset bundling
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            touch .env
          fi

      - name: Install Dependencies & Prepare iOS Config
        run: |
          flutter pub get
          flutter build ios --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App with Unsigned Signing Allowed
        run: |
          flutter build ios --release --no-codesign

      - name: Bundle Payload into Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/ 2>/dev/null || cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/Payload/
          cd build
          zip -r -q TrackMyTrip-release-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyTrip-ios-ipa
          path: build/TrackMyTrip-release-unsigned.ipa
          retention-days: 7


name: Build iOS IPA

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify CocoaPods Environment
        run: |
          pod --version

      - name: Create fallback .env file for asset bundling
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            touch .env
          fi

      - name: Install Dependencies & Prepare iOS Config
        run: |
          flutter pub get
          flutter build ios --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App with Unsigned Signing Allowed
        run: |
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Automatic
          cd ..
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGN_REQUIRED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

      - name: Bundle Payload into Unsigned IPA
        run: |
          mkdir -p build/Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app build/Payload/
          elif [ -d "build/ios_derived/Build/Products/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/Payload/
          else
            echo "Searching for built Runner.app bundle..."
            FOUND_APP=$(find build -name "Runner.app" -type d | head -n 1)
            if [ -n "$FOUND_APP" ]; then
              cp -r "$FOUND_APP" build/Payload/
            else
              echo "Error: Runner.app not found in build directory!"
              exit 1
            fi
          fi
          cd build
          zip -r -q TrackMyTrip-release-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyTrip-ios-ipa
          path: build/TrackMyTrip-release-unsigned.ipa
          retention-days: 7

name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Lint, Test & AQIL Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create fallback .env file
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze lib --fatal-infos

      - name: Unit, Super Admin, DevOps & Secrets Tests
        run: |
          flutter test test/super_admin_test.dart
          flutter test test/twenty_loop_features_resilience_test.dart
          flutter test test/devops_pipeline_and_admin_telemetry_test.dart
          flutter test test/devops_secrets_and_vault_test.dart

      - name: Comprehensive AQIL Multi-Viewport Tests
        run: flutter test test/aqil_all_screens_comprehensive_test.dart

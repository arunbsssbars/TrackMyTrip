name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Lint, Test & AQIL Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create fallback .env file
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "Using secret ENV_FILE configured in repository secrets."
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            echo "NOTICE: ENV_FILE secret not found; using fallback template from .env.example."
            cp .env.example .env
          fi
          echo "Environment configuration ready ($(wc -l < .env) lines)."

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze lib --fatal-infos

      - name: Unit, Super Admin, DevOps & Secrets Tests (with Coverage)
        run: |
          flutter test --coverage test/super_admin_test.dart test/twenty_loop_features_resilience_test.dart test/devops_pipeline_and_admin_telemetry_test.dart test/devops_secrets_and_vault_test.dart test/live_currency_and_crash_reporting_test.dart test/ci_cd_five_loops_test.dart

      - name: Evaluate Code Coverage
        run: |
          chmod +x scripts/parse_coverage.sh
          ./scripts/parse_coverage.sh 40.0 coverage/lcov.info

      - name: Comprehensive AQIL Multi-Viewport Tests
        run: flutter test test/aqil_all_screens_comprehensive_test.dart

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          retention-days: 14

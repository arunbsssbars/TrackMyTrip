<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified - TrackMyTrip</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --primary: #0D9488;
      --primary-dark: #0F766E;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --success: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0D9488, #10B981);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 20px rgba(13, 148, 136, 0.3);
    }
    .badge svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: white;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .status-pill {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.4);
    }
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .secondary-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 14px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .secondary-link:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <div class="status-pill">✓ Verified Successfully</div>
    <h1>Welcome to TrackMyTrip</h1>
    <p>Your email has been confirmed. You're ready to log journeys, track GPS routes, and share memories.</p>
    
    <a href="trackmytrip://email-verified" class="btn" id="openAppBtn">Open TrackMyTrip App</a>
    <div>
      <a href="/" class="secondary-link">Continue to Web Dashboard &rarr;</a>
    </div>
  </div>

  <script>
    // Automatically trigger app launch via custom URL scheme
    (function() {
      const appUrl = "trackmytrip://email-verified";
      setTimeout(function() {
        window.location.href = appUrl;
      }, 500);
    })();
  </script>
</body>
</html>
